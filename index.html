<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary meta -->
    <title>SportBooker — Book Sports Venues Instantly</title>
    <meta
      name="description"
      content="SportBooker makes it easy to discover and book sports venues, join matches, and manage your bookings — all in one place."
    />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SportBooker" />
    <meta
      property="og:title"
      content="SportBooker — Book Sports Venues Instantly"
    />

      property="og:description"
      content="SportBooker makes it easy to discover and book sports venues, join matches, and manage your bookings — all in one place."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://sportbooker.net" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SportBooker — Book Sports Venues Instantly"
    />
    <meta
      name="twitter:description"
      content="SportBooker makes it easy to discover and book sports venues, join matches, and manage your bookings — all in one place."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

    <div id="root"></div>
